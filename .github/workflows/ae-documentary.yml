name: AE documentary previews

on:
  push:
    branches: [feat/ae-parity]
    paths:
      - moviepy/ae/templates/documentary/**
      - tests/ae/test_documentary*.py
      - examples/ae_documentary.py
      - .github/workflows/ae-documentary.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive reproducible source (no user media or credentials)
        run: >-
          git archive --format=zip -o ae-source.zip HEAD
          moviepy tests/ae tests/conftest.py examples docs/ae
          pyproject.toml setup.cfg README.md LICENCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ae-documentary-source
          path: ae-source.zip
          retention-days: 3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache portable offline style tools
        run: >-
          python -m pip download --only-binary=:all: --platform any
          --python-version 312 --implementation py --abi none
          black==24.4.2 isort==5.13.2 flake8==7.1.1
          flake8-absolute-import==1.0.0 flake8-docstrings==1.7.0
          flake8-rst-docstrings==0.3.0 flake8-implicit-str-concat==0.4.0
          --dest style-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: ae-documentary-style-tools
          path: style-wheels/
          retention-days: 3
      - name: Install runtime and tests
        run: python -m pip install ".[test]"
      - name: Test documentary templates
        if: hashFiles('tests/ae/test_documentary*.py') != ''
        run: python -m pytest tests/ae/test_documentary*.py -q --junitxml=documentary-tests.xml
      - name: Render self-contained previews
        if: hashFiles('examples/ae_documentary.py') != ''
        run: python examples/ae_documentary.py --demo --output-dir documentary-previews --width 960 --duration 4 --fps 24
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('documentary-tests.xml', 'documentary-previews/**') != ''
        with:
          name: ae-documentary-previews
          path: |
            documentary-previews/
            documentary-tests.xml
          retention-days: 14
